name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips the Playwright browser download and the prepare build;
      # the runner builds explicitly.
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/test-all.ts --offline
